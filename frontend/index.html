<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">EV Charging System</a>
        <span class="text-light">Management Dashboard</span>
    </nav>

    <main class="container py-4">
        <h2>Dashboard</h2>
        <p class="text-secondary">
            Monitor electric vehicles and charging resources.
        </p>

        <div id="message" class="mb-3"></div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Total EVs</h5>
                        <h2 id="ev-count">—</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Charging Stations</h5>
                        <h2 id="station-count">—</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Chargers</h5>
                        <h2 id="charger-count">—</h2>
                    </div>
                </div>
            </div>
        </div>

        <section class="card mb-4">
            <div class="card-header">Electric Vehicles</div>
            <div class="card-body table-responsive">
                <table class="table table-striped">
                    <thead id="ev-head"></thead>
                    <tbody id="ev-body"></tbody>
                </table>
            </div>
        </section>

        <section class="card mb-4">
            <div class="card-header">Charging Stations</div>
            <div class="card-body table-responsive">
                <table class="table table-striped">
                    <thead id="station-head"></thead>
                    <tbody id="station-body"></tbody>
                </table>
            </div>
        </section>
        
        <section class="card mb-4">
    <div class="card-header">Create Charging Request</div>

    <div class="card-body">
        <form id="charging-request-form">
            <div class="mb-3">
                <label for="ev-id" class="form-label">
                    Select EV
                </label>
                <select id="ev-id" class="form-select" required>
                    <option value="">Select an EV</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="station-id" class="form-label">
                    Select Charging Station
                </label>
                <select id="station-id" class="form-select" required>
                    <option value="">Select a station</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="required-energy" class="form-label">
                    Required Energy (kWh)
                </label>
                <input
                    type="number"
                    id="required-energy"
                    class="form-control"
                    min="1"
                    step="any"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="departure-time" class="form-label">
                    Expected Departure Time
                </label>
                <input
                    type="datetime-local"
                    id="departure-time"
                    class="form-control"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Create Request
            </button>
        </form>

        <div id="request-message" class="mt-3"></div>
    </div>
</section>
        <section class="card mb-4">
            <div class="card-header">Chargers</div>
            <div class="card-body table-responsive">
                <table class="table table-striped">
                    <thead id="charger-head"></thead>
                    <tbody id="charger-body"></tbody>
                </table>
            </div>
        </section>

        <button class="btn btn-primary" onclick="loadDashboard()">
            Refresh Data
        </button>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
